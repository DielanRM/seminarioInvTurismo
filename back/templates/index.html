<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{url_for('static', filename='styles.css')}}">
    <title>Document</title>
</head>

<body>
    <header>
        <h1>Cotizador de Viajes</h1>

        <div class="botones">
            <button class="boton_header">Registrarse</button>
            <button class="boton_header">Ingresar</button>
        </div>
    </header>

    <main>
        <div class="contenedor_principal">

            <form class="formulario">

                <div class="campo">
                    <label for="nombre">Escribe tu nombre</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="campo">
                    <label for="edad">Edad</label>
                    <input type="number" id="edad" required>
                </div>

                <div class="campo">
                    <label for="genero">Género</label>
                    <input type="text" id="genero" placeholder="Masculino / Femenino" required>
                </div>

                <div class="campo">
                    <label for="destino">
                        Escribe la ciudad o país que deseas visitar
                    </label>
                    <input type="text" id="destino" required>
                </div>

                <div class="campo">
                    <label for="fecha">
                        ¿En qué fecha te gustaría viajar?
                    </label>
                    <input type="date" id="fecha" required>
                </div>

                <div class="campo">
                    <label for="presupuesto">
                        Presupuesto disponible en pesos
                    </label>
                    <input type="number" id="presupuesto" required>
                </div>

                <button type="submit">Enviar</button>

            </form>

            <div id="tabla_respuestas" class="tabla_respuestas"></div>

        </div>

        <div id="graficas" class="contenedor_graficas">

            <div id="grafica_mapa" class="grafica"></div>

            <div id="grafica_dispersion" class="grafica"></div>

        </div>
    </main>

    <script src="https://cdn.plot.ly/plotly-3.0.1.min.js"></script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>

</html>
